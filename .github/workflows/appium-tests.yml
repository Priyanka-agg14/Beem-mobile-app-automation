name: Appium Android E2E Tests

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  test:
    runs-on: macos-13

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Set up Node.js & Appium
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Appium & UiAutomator2 Driver
        run: |
          npm install -g appium
          appium driver install uiautomator2

      - name: Start Appium Server
        run: |
          appium --port 4724 --log appium.log &
          sleep 5

      # Optional: Add step here to download your APK if hosted on a public/private storage URL
      # - name: Download APK
      #   run: |
      #     mkdir -p app
      #     curl -L -o app/app-release_new.apk "YOUR_APK_DOWNLOAD_URL"

      - name: Run Android Emulator & Execute Pytest Suite
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 33
          target: google_apis
          arch: x86_64
          profile: Pixel_6
          script: |
            pytest
        env:
          APPIUM_SERVER_URL: "http://127.0.0.1:4724"
          APP_PATH: "${{ github.workspace }}/app/app-release_new.apk"

      - name: Upload Test Reports & Logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-artifacts
          path: |
            reports/
            appium.log